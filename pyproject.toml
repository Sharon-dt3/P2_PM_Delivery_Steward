[project]
name = "pm"
version = "0.1.0"
description = "P2 PM Delivery Steward -- second agent in the Incubation Pod Three-Agent Delivery Plan (P2 of P1/P2/P3). Starting scope is D11 per ../P3_Agents/docs/MASTER_IMPLEMENTATION_PLAN.md: seed data plus tracker/code-host/risk-log adapters, inheriting P1's Teams reader and publisher outright with zero new adapter code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.3",
    # PM-04 (D11, master plan): the chat dependency -- reading channel
    # messages and posting nudges/escalations/digests -- is satisfied by
    # P1's own adapters.factory (get_teams_reader, get_teams_publisher)
    # and its underlying MockTeamsReader/LogPublisher classes, with zero
    # new adapter implementation code in this repo. This path dependency
    # on the sibling P1 repo is how that inheritance is wired; see
    # src/pm/adapters/README.md (added in the PM-04 task) for the exact
    # import points once that task lands.
    "p1",
    # CHN-33's extracted spine package (gateway, schema layer, proposals,
    # write guard, grounding kernel, config-store pattern) -- P1's own
    # foundation, reused here rather than copy-pasted, per spine's own
    # docstring ("Reused, not copy-pasted, by every agent built after
    # P1"). Declared directly (not only transitively through p1) so this
    # repo's own future code can import spine.* without relying on
    # whatever p1 happens to re-export.
    "spine",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
# uv's .pth site-packages redirects for local packages are unreliable
# outside a handful of execution contexts, but pytest's own pythonpath
# option adds these paths itself, independent of site.py's .pth
# processing. spine is this repo's OWN copy (packages/spine, see its
# PROVENANCE.md) and comes first; ../P3_Agents/src is P1's code, read for
# its adapters/config/contracts and never modified from here. P1's own copy
# of spine (../P3_Agents/packages/spine) is deliberately NOT on this list.
pythonpath = [
    "src",
    "packages/spine/src",
    "../P3_Agents/src",
]

[tool.uv]
# p1's own pyproject pins spine to ITS copy (../P3_Agents/packages/spine) via
# p1's workspace sources, which would otherwise conflict with this repo's
# copy. Overriding the requirement forces every package in this environment,
# p1 included, onto the one spine this repo owns.
override-dependencies = ["spine"]

[tool.uv.workspace]
# spine is owned by this repo: a copy taken from P1 at a pinned commit, so
# changes P2 needs in spine never edit P1's repo (and P1's later changes
# never silently change P2). See packages/spine/PROVENANCE.md.
members = ["packages/spine"]

[tool.uv.sources]
spine = { workspace = true }
# P1 stays a plain, read-only path dependency on the sibling repo -- used
# for its Teams adapters, scope gate, config loader and outcome-record
# contract. Nothing in this repo edits it.
p1 = { path = "../P3_Agents" }
